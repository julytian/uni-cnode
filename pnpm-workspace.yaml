minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shamefullyHoist: true
dangerouslyAllowAllBuilds: true
shellEmulator: true

patchedDependencies:
  '@wot-ui/ui@2.3.2': patches/@wot-ui__ui@2.3.2.patch
# pnpm 12 trustPolicy=no-downgrade 跨大版本误报豁免：
# @vitejs/plugin-legacy@5.3.2 为 Vite 官方 2024-03 发布版本（uni-app 依赖锁定），
# 其后 8.x 带 provenance 导致旧版被判 trust 降级（pnpm#10202）
trustPolicyExclude:
  - '@vitejs/plugin-legacy@5.3.2'
  - 'semver@6.3.1'
  - 'chokidar@4.0.3'
